name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboard data
        run: node scripts/validate_dashboard.js
      - name: Validate work monitor data
        run: node work-monitor/validate.js
      - name: Validate project finance data
        run: node boq/validate.js
      - name: Validate reusable upload apps
        run: |
          node --check work-monitor-upload/app.js
          node --check work-monitor-upload/excel-parser.js
          node --check work-monitor-multifile/app.js
      - name: Hotfix and validate Carbon Token Gantt
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('carbon-token-gantt/index.html')
          s = p.read_text(encoding='utf-8')
          old = "filters:$('#filters'),search:$('#searchInput')"
          new = "filters:$('#filters'),legend:$('#legend'),search:$('#searchInput')"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          elif new not in s:
              raise SystemExit('Carbon Gantt DOM binding pattern not found')
          scripts = re.findall(r'<script>(.*?)</script>', s, flags=re.S)
          Path('/tmp/carbon-gantt-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/carbon-gantt-inline.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
