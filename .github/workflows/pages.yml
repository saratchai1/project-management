name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboard data
        run: node scripts/validate_dashboard.js
      - name: Validate work monitor data
        run: node work-monitor/validate.js
      - name: Validate project finance data
        run: node boq/validate.js
      - name: Validate reusable upload apps
        run: |
          node --check work-monitor-upload/app.js
          node --check work-monitor-upload/excel-parser.js
          node --check work-monitor-multifile/app.js
      - name: Normalize Buddhist-year dates in Carbon Token Gantt
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('carbon-token-gantt/v4.js')
          s = p.read_text(encoding='utf-8')
          old1 = "if(v instanceof Date&&!isNaN(v)){const d=new Date(v);d.setHours(0,0,0,0);return d}"
          new1 = "if(v instanceof Date&&!isNaN(v)){const d=new Date(v);if(d.getFullYear()>2400)d.setFullYear(d.getFullYear()-543);d.setHours(0,0,0,0);return d}"
          old2 = "const d=new Date(s);return isNaN(d)?null:d}"
          new2 = "const d=new Date(s);if(isNaN(d))return null;if(d.getFullYear()>2400)d.setFullYear(d.getFullYear()-543);d.setHours(0,0,0,0);return d}"
          if old1 in s:
              s = s.replace(old1, new1, 1)
          elif new1 not in s:
              raise SystemExit('Date-object normalization pattern not found')
          if old2 in s:
              s = s.replace(old2, new2, 1)
          elif new2 not in s:
              raise SystemExit('Text-date normalization pattern not found')
          p.write_text(s, encoding='utf-8')
          PY
          node --check carbon-token-gantt/v4.js
          grep -q 'v4.js' carbon-token-gantt/index.html
          grep -q 'v4.css' carbon-token-gantt/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
