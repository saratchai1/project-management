name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboard data
        run: node scripts/validate_dashboard.js
      - name: Validate work monitor data
        run: node work-monitor/validate.js
      - name: Validate project finance data
        run: node boq/validate-embedded.js
      - name: Validate reusable upload apps
        run: |
          node --check work-monitor-upload/app.js
          node --check work-monitor-upload/excel-parser.js
          node --check work-monitor-multifile/app.js
          node --check work-monitor-multifile/monitor-work.js
          node --check work-monitor-multifile/file-persistence.js
          node --check work-monitor-multifile/refresh-restore.js
          grep -q 'monitor-work.js' work-monitor-multifile/dashboard.html
          grep -q 'monitor-work.css' work-monitor-multifile/dashboard.html
          grep -q 'file-persistence.js' work-monitor-multifile/dashboard.html
          grep -q 'refresh-restore.js' work-monitor-multifile/index.html
      - name: Validate Carbon Token Gantt (Huay-Kha-Kaeng style)
        run: |
          node --check carbon-token-gantt/hkk.js
          grep -q 'hkk.js' carbon-token-gantt/index.html
          grep -q 'hkk.css' carbon-token-gantt/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
